# daemon-killer config for Windows. Installed to C:\ProgramData\daemon-killer\config.toml.
# Every unset key falls back to the default shown in src/config.rs.

# Alias of the Clash Wintun adapter (Get-NetAdapter). Pin it in Clash (`tun.device: Mihomo`).
tun_device = "Mihomo"

# The Clash core. Its TCP/UDP may go out directly (proxy upstreams, DNS, DIRECT). Matched by
# executable, since Clash Party runs mihomo as the same user as every other app.
# Elevated PowerShell: (Get-Process mihomo).Path
core_program = 'C:\Program Files\Clash Party\resources\sidecar\mihomo.exe'

# Other executables that may reach the internet directly, bypassing the TUN. Each entry keeps
# working when Clash is down, so only add programs that cannot go through the TUN.
# Not tailscaled.exe: with Clash's auto-route its traffic already leaves through the TUN, and
# a permit here would let it (and an exit node) go out directly once Clash dies. For direct
# Tailscale paths use a mihomo rule instead: PROCESS-NAME,tailscaled.exe,DIRECT
allow_programs = []

# RFC1918 / link-local / multicast may bypass the TUN (printers, corp 10.0.0.0/8).
allow_lan = false
allow_cidrs = []
# Adapters this host's apps may use besides the TUN, e.g. ["vEthernet (WSL)"] to talk to WSL.
# Only this host's own sockets are filtered; WSL and VMs are out of scope.
# Add "Tailscale" to reach the tailnet: its packets are re-encrypted by tailscaled and still
# leave through the TUN, but they skip mihomo's rules (an exit node becomes the egress) and
# tailnet peers can reach local services.
allow_interfaces = []
allow_dhcp = true
# Block from TCP/IP start until the Base Filtering Engine loads the persistent filters.
boot_time_block = false

# For `status` and `up`, which refuses while Clash is down; the WFP filters hold either way.
mihomo_process = "mihomo"
# Clash Party names its pipe after the user and core PID; Clash Verge Rev uses \\.\pipe\verge-mihomo.
controller = '\\.\pipe\MihomoParty\mihomo-*'
# controller_secret = ""
