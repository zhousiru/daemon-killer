# daemon-killer config for macOS. Installed to /etc/daemon-killer/config.toml.
# Every unset key falls back to the default shown in src/config.rs.

# Clash TUN interface. Pin it in Clash (`tun.device: utun1500`) so it never changes.
tun_device = "utun1500"

# Owner of the Clash core. Its TCP/UDP may go out directly (proxy upstreams, DNS, DIRECT).
# Clash Party runs mihomo as root, so every root process may go direct; user apps are still
# forced through the TUN.
core_uid = 0

# RFC1918 / link-local / multicast may bypass the TUN (printers, AirDrop, corp 10.0.0.0/8).
allow_lan = false
allow_cidrs = []
# Host-only VM bridges, e.g. ["bridge100", "bridge101"]. They are not a path to the internet.
allow_interfaces = []
allow_dhcp = true

# For `status` and `up`, which refuses while Clash is down; the pf rules hold either way.
mihomo_process = "mihomo"
controller = "/tmp/mihomo-party-*.sock"
# controller_secret = ""
